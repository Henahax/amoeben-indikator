version: '3.8'
services:
  amoeben-indikator-app:
    image: henahax/amoeben-indikator:latest
    container_name: amoeben-indikator
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - PORT=3000
      - DATABASE_URL=/app/data/amoeben-indikator.db
    volumes:
      - app-data:/app/data
    ports:
      - '8080:3000'
    restart: unless-stopped

volumes:
  app-data:
    name: amoeben-indikator-data
